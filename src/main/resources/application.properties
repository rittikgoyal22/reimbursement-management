spring.application.name=reimbursement-management
server.port=8084

# mysql database connection properties
#spring.datasource.url=jdbc:mysql://localhost:3306/reimbursement_management
#spring.datasource.username=root
#spring.datasource.password=Rittik@95174
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:h2:file:~/data/reimbursement_management;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (must match all other ETD services)
jwt.secret=etdTravelDeskJwtSecretKey1234567890ABCDEF

# auth-service URL for blacklist check
auth.service.base_url=http://localhost:8080/

# upload directory for reimbursement PDF invoices (auto-created on first upload)
app.upload.dir=./uploads

# travel planner service URLs
travel.planner.service.base_url = http://localhost:8082/
travel.planner.service.url = api/
travel.planner.service.skip = false

# account management service URLs
account.management.service.base_url = http://localhost:8081/
account.management.service.url = api/
account.management.service.skip = false